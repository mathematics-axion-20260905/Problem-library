# Direct Hostinger DNS topology for dirac.space.
# Cloudflare is not required: Hostinger A records point directly to this VPS.

map $http_upgrade $dirac_connection_upgrade {
    default upgrade;
    "" close;
}

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $dirac_connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

server {
    listen 80;
    listen [::]:80;
    server_name dirac.space www.dirac.space library.dirac.space;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3017;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name math.dirac.space;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3014;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name notebook.dirac.space;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3015;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name writer.dirac.space;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:3016;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.dirac.space;
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8007;
    }
}

# Reserved until the auth/RBAC phase is enabled.
server {
    listen 80;
    listen [::]:80;
    server_name auth.dirac.space;
    return 404;
}
